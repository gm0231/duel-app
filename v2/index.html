<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>トトと簡易デュエル</title>
<style>
  :root{
    --gold:#c9a227; --gold-dim:#8a6d1f; --ink:#0d0b08; --panel:#1b1712; --panel2:#241e16;
    --tile:#2a2318; --tile-edge:#4a3d22; --txt:#e8dcc0; --txt-dim:#a89878; --bad:#e06666; --ok:#7fc97f;
    /* layout sizes — recomputed by client.js applyLayout() at duel start and
       frozen for the whole duel; these are pre-duel fallbacks */
    --sw:47px; --sh:79px; --hw:56px; --hh:90px; --pv:0px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button:active{transform:translateY(1px);filter:brightness(1.18);}
  .bigbtn:active,.optbtn:active{filter:brightness(1.25);}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
  /* layout round 4 hardening: never let a webview inflate text on its own —
     the stat strips budget exact px per line (see .slotstats/.hstats) */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  #app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  #app>*{flex:0 0 auto;}
  /* ---------- top bar ---------- */
  #topbar{display:flex;align-items:center;gap:8px;height:42px;padding:4px 8px;background:linear-gradient(#241c10,#171208);border-bottom:1px solid var(--gold-dim);overflow:hidden;}
  #topbar .who{font-size:11px;color:var(--txt-dim);}
  #topbar .lp{font-size:17px;font-weight:700;color:var(--gold);min-width:64px;}
  #topbar .mid{flex:1;text-align:center;font-size:12px;}
  #topbar .piles{font-size:11px;color:var(--txt-dim);text-align:right;line-height:1.5;}
  /* ---------- field ---------- */
  .field{padding:2px 6px;position:relative;}
  /* redesign D (p4a): opponent-turn air. Both layers are preset
     inside the fields (absolute, inset 0) so the board's frozen
     dimensions never change; render() only toggles #app.opp-turn
     and the breathing itself is a pure CSS opacity animation on
     the preset rim layer — no per-frame JS, no box-shadow/filter
     writes (the glow paint below is static). */
  .turnbreathe{position:absolute;inset:0;border:1.5px solid rgba(91,141,217,.9);border-radius:6px;box-shadow:inset 0 0 18px rgba(91,141,217,.45),inset 0 0 4px rgba(91,141,217,.5);opacity:0;pointer-events:none;z-index:6;}
  #app.opp-turn .turnbreathe{animation:oppbreathe 2.6s ease-in-out infinite alternate;}
  @keyframes oppbreathe{from{opacity:.55;}to{opacity:1;}}
  .turndim{position:absolute;inset:0;background:rgba(0,0,0,.20);opacity:0;transition:opacity .35s ease;pointer-events:none;z-index:6;}
  #app.opp-turn .turndim{opacity:1;}
  .zrow{display:flex;gap:4px;justify-content:center;align-items:flex-end;margin:1px 0;}
  .zrow .rowlabel{font-size:9px;color:var(--txt-dim);width:26px;text-align:right;padding-bottom:4px;}
  /* all zones share ONE size (user spec); the slot is the zone box, the tile
     (card image) sits inside it, and ATK/DEF live in a strip at the slot
     bottom — OUTSIDE the card frame, with ATK/DEF labels */
  .slot{width:var(--sw);height:var(--sh);border:1px solid var(--tile-edge);border-radius:5px;background:var(--tile);position:relative;flex:0 0 auto;overflow:hidden;}
  .slot .znum{position:absolute;top:0;left:2px;font-size:9px;color:#a89878;z-index:3;}
  .setbadge{position:absolute;top:1px;right:1px;z-index:3;font-size:9px;font-weight:700;color:#ffe9a8;background:#4a3a10;border:1px solid var(--gold-dim);border-radius:4px;padding:0 3px;}
  .slot.fzone{border-color:#4a6a8a;}
  .slot.hl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 12px #c9a22788;cursor:pointer;animation:pulse 1s infinite alternate;}
  .slot.picked{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);}
  @keyframes pulse{from{box-shadow:0 0 0 1px var(--gold);}to{box-shadow:0 0 0 3px var(--gold),0 0 14px #c9a227aa;}}
  .tile{position:absolute;top:1px;left:1px;right:1px;bottom:1px;border-radius:4px;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:2px;}
  .slot.hs .tile{bottom:23px;}
  /* layout round 4: the strip is TWO stacked lines (ATK line over DEF
     line), never one row of two spans. The old one-row form could not
     fit "ATK 3750"+"DEF 3400" (~83px at 9/10px) inside a 53-64px
     strip at ANY viewport size: flex-shrink narrowed each span until
     its text wrapped, the 28px two-line span overflowed the 15px
     strip symmetrically, and the number line's lower half was clipped
     by the slot's overflow:hidden — height-independent, invisible to
     the box-bottom fit loop. Each line here is nowrap with an explicit
     11px line-height, so a line can only ever overflow horizontally
     (clipped inside its own line), never vertically. Widths measured
     in Chromium: worst line "DEF 3400" = 38.3px at 8px/9px, ~35.8px
     with the -.5px letter-spacing — inside the 36px inner width of
     even the minimum 40px tile.
     BU-11 correction (brushup round 2, 2026-11-03): that budget was
     wrong twice — the -.5px letter-spacing was never actually in
     the CSS (letter-spacing:0 stood here), and the inner width of
     a 40px tile is 34px, not 36 (40 − 2 border − 2x2 padding).
     Live measurement at the 40px floor showed EVERY line 3-6px
     over (defense DEF lines worst: the defline rule below kept
     their digits at 10px, above the smalltiles 9px). The budget
     now stands as: -.5px tracking at every size, smalltiles
     defline digits at the smalltiles size, and the big5 shrink
     deepened (8px, 7.5px at the floor) — re-measured in Chromium
     across normal / defmode / big5 / defmode+big5 strips at tile
     40px and 47px: worst line fits with 0px to spare. */
  .slotstats{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;flex-direction:column;justify-content:center;padding:0 2px;font-size:9px;letter-spacing:-.5px;color:var(--txt-dim);overflow:hidden;}
  .slotstats span{display:block;white-space:nowrap;overflow:hidden;line-height:12px;}
  .slotstats b{color:var(--txt);font-size:10px;}
  .slotstats.big5 b,.hstats.big5 b{font-size:8px;}
  .slotstats.big5.defmode span.defline b{font-size:8px;}
  .smalltiles .slotstats{font-size:8px;}
  .smalltiles .slotstats b{font-size:9px;}
  .smalltiles .slotstats.defmode span.defline b{font-size:9px;}
  .smalltiles .slotstats.big5 b{font-size:7.5px;}
  .smalltiles .slotstats.big5.defmode span.defline b{font-size:7.5px;}
  .tile .nm{font-size:clamp(8px, calc(var(--sw) * 0.17), 12px);line-height:1.15;background:#000a;padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* scale .82: the rotated inner is imgH (1.22 x tile width) wide;
     unscaled it would overflow the slot by ~11% on each side and the
     slot's overflow:hidden would shave the card's own top/bottom
     edges (post-rotation sides). .82 = 1/1.22 fits it exactly. */
  .tile.def .inner{transform:rotate(90deg) scale(.82);}
  .tile .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:2px;transition:transform .15s;}
  .tile.back{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .tile.back .nm{display:none;}
  .tile .mats{position:absolute;top:1px;right:1px;background:var(--gold);color:#000;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;z-index:2;}
  .tile.actionable{box-shadow:0 0 0 2px var(--gold) inset;cursor:pointer;}
  .slot.targeted{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad);}
  /* ---------- piles ---------- */
  .pilebar{display:flex;gap:4px;justify-content:center;margin:1px 0;height:28px;}
  .pile{position:relative;min-width:52px;height:28px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid var(--tile-edge);border-radius:5px;background:var(--panel);font-size:11px;text-align:center;color:var(--txt-dim);cursor:pointer;}
  .pile b{color:var(--txt);font-size:12px;}
  .pile.actionable{border-color:var(--gold);color:var(--txt);}
  .pile .pact{font-size:9px;color:var(--gold);margin-left:4px;}
  .pile.actionable::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--gold);}
  /* ---------- mid bar ---------- */
  #midbar{background:var(--panel);border-top:1px solid var(--tile-edge);border-bottom:1px solid var(--tile-edge);padding:3px 6px;}
  /* the chain row's height is ALWAYS reserved (visibility toggles, never
     display) so a chain appearing mid-duel cannot shift the board */
  #chainbar{display:flex;visibility:hidden;gap:4px;overflow-x:auto;height:21px;padding:2px 0;}
  #chainbar.on{visibility:visible;}
  #chainbar.idle{visibility:visible;align-items:center;}
  #chainbar .prevlog{flex:1;min-width:0;font-size:10px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #loghistbtn{flex:0 0 auto;height:19px;font-size:10px;color:var(--gold);background:#241a0e;border:1px solid var(--gold-dim);border-radius:5px;padding:0 9px;cursor:pointer;}
  .loghistrow{font-size:11px;line-height:1.6;padding:3px 0;border-bottom:1px solid #2c2416;color:var(--txt);}
  .loghistrow .lt{color:var(--txt-dim);margin-right:6px;}
  .link{flex:0 0 auto;font-size:10px;border:1px solid var(--gold-dim);border-radius:10px;padding:2px 7px;background:var(--panel2);white-space:nowrap;}
  .link.solving{border-color:#ffd94d;background:#4a3a10;color:#fff;box-shadow:0 0 10px #ffd94d99,0 0 0 1px #ffd94d;}
  .link.negated{text-decoration:line-through;opacity:.55;}
  .link .no{color:var(--gold);font-weight:700;}
  #logline{font-size:10px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px;line-height:15px;}
  #phasebar{display:flex;align-items:center;gap:8px;height:34px;}
  #phasebar .lp{font-size:16px;font-weight:700;color:var(--gold);}
  #phaseinfo{flex:0 1 auto;min-width:72px;font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* redesign E (p5b): once a phase sweep has settled, the phase
     name "sits" in the phase bar — gold and bold. render() only
     rewrites the element's text, never its class list, so the
     seated state survives re-renders until the next transition
     (fxPhaseBanner clears it) or a duel reset. */
  #phaseinfo.fx-seated{color:#e6c877;font-weight:700;}
  /* redesign E (p5b): the sweep's settled remnant — a 1px gold
     hairline across the TOP of the mid bar, opacity 0.30. It is a
     decoration ON the bar (#midbar is position:relative), never a
     layout change: the bar's frozen height is untouched. */
  .fx-phase-hairline{position:absolute;left:0;right:0;top:3px;height:1px;background:#c9a227;opacity:0;pointer-events:none;}
  #menubtn,#fxbtn{flex:0 0 auto;min-height:30px;}
  #menubtn:disabled{opacity:.38;}
  #phasebtn{flex:1;min-width:96px;min-height:30px;}
  /* The phase button's label never wraps: at 13px 「エンドフェイズへ」
     broke to a second line whose 「ズへ」 was clipped by the fixed
     32px height (design audit, reproduced at both heights). One
     line, ellipsis as backstop only. */
  #phasebtn{background:var(--gold);color:#191104;border:0;border-radius:6px;font-size:12.5px;font-weight:700;padding:0 6px;height:32px;min-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #phasebtn:disabled{background:#4a3d22;color:#8a7c55;}
  #menubtn,#fxbtn{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:6px;font-size:12px;padding:0 6px;height:32px;}
  /* ---------- hand ---------- */
  #handbar{background:var(--panel);border-top:1px solid var(--gold-dim);padding:3px 4px 5px;}
  #handbar .who{font-size:10px;color:var(--txt-dim);padding:0 2px;height:11px;line-height:11px;}
  /* layout round 4: no visible scrollbar on the hand — in classic-
     scrollbar environments the horizontal bar renders INSIDE #hand's
     fixed height and eats the bottom ~15px of every card, which is
     exactly the .hstats strip (observed in the parent's browser at 6
     hand cards: stats row gone entirely, names still visible).
     Scrolling itself (touch / wheel / drag) is unaffected. */
  #hand{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;height:var(--hh);scrollbar-width:none;}
  #hand::-webkit-scrollbar{display:none;}
  /* hand card: image area on top (name overlaid at its bottom), ATK/DEF in a
     strip BELOW the image — outside the card frame, same as board tiles */
  .hcard{width:var(--hw);height:var(--hh);flex:0 0 auto;border:1px solid var(--tile-edge);border-radius:5px;background:var(--tile);position:relative;padding:0;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;}
  .himg{flex:1 1 auto;position:relative;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;}
  .hcard .cnt{position:absolute;top:1px;right:1px;font-size:9px;font-weight:700;color:#191104;background:var(--gold);border-radius:6px;padding:0 4px;z-index:2;}
  .hcard.dim{opacity:.5;filter:saturate(.6);}
  .hcard.placing{box-shadow:0 0 0 2px var(--gold);}
  .hcard .nm{position:absolute;left:2px;right:2px;bottom:2px;font-size:10px;line-height:1.15;background:#000a;padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* layout round 4: same two-line strip as .slotstats (see there) —
     the one-row form wrapped identically and the wrapped number line
     was clipped by .hcard's overflow:hidden at the card's bottom edge */
  .hstats{height:24px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;padding:0 2px;font-size:9px;letter-spacing:-.5px;color:var(--txt-dim);overflow:hidden;}
  .hstats span{display:block;white-space:nowrap;overflow:hidden;line-height:12px;}
  .hstats b{color:var(--txt);font-size:10px;}
  .hcard.actionable{box-shadow:0 0 0 2px var(--gold);}
  .hcard.back .himg{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  /* ---------- persistent card-detail preview (leftover space only) ---------- */
  #preview{display:none;height:var(--pv);border-top:1px solid var(--gold-dim);background:var(--panel);padding:6px 8px;gap:8px;overflow:hidden;cursor:pointer;}
  #preview.on{display:flex;}
  #preview .pv-art{flex:0 0 auto;width:calc((var(--pv) - 12px) * 0.72);background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;border-radius:4px;border:1px solid var(--tile-edge);}
  #preview .pv-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  #preview .pv-top{display:flex;gap:8px;align-items:baseline;}
  #preview .pv-name{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #preview .pv-stats{font-size:11px;color:var(--txt);white-space:nowrap;}
  /* brushup round 2: in compact mode the stacked reason line is
     clipped by the strip's fixed height (overflow hidden), so the
     reason rides the title line instead and truncates first; the
     name and stats never shrink (the card's identity is the
     strip's first job) */
  #preview.compact .pv-name{flex:0 0 auto;}
  #preview.compact .pv-stats{flex:0 0 auto;}
  #preview .pv-reason-inline{flex:1 1 auto;min-width:0;font-size:10px;color:#f0c08a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #preview .pv-reason{font-size:10px;color:#f0c08a;line-height:1.35;}
  .pv-meta{font-size:10px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #preview .pv-text{flex:1 1 auto;overflow-y:auto;font-size:11px;line-height:1.55;white-space:pre-wrap;margin-top:2px;}
  #preview.compact{padding:2px 8px;}
  #preview.compact .pv-art{display:none;}
  #preview.compact .pv-text{display:none;}
  #preview.compact .pv-meta{display:none;}
  /* ---------- chain dock ---------- */
  #dock{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#171208f2;border-top:2px solid var(--gold);padding:8px;display:none;}
  #dock.on{display:block;}
  #dock .ttl{font-size:12px;color:var(--gold);font-weight:700;}
  #dock .ctx{font-size:11px;color:var(--txt-dim);margin:2px 0 6px;}
  #dock .toplink{text-decoration:underline dotted;text-underline-offset:2px;}
  #dock .cands{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .cand{flex:0 0 auto;max-width:150px;border:1px solid var(--gold);border-radius:6px;background:var(--panel2);padding:6px 8px;font-size:11px;cursor:pointer;position:relative;}
  .cand .loc{color:var(--txt-dim);font-size:10px;}
  .cand .dismiss{display:inline-block;margin-top:5px;font-size:10px;color:#f0c08a;background:#2a1c0d;border:1px solid #a86a2a;border-radius:6px;padding:6px 8px;cursor:pointer;}
  .cand.dismissed{opacity:.45;border-style:dashed;}
  #dock .row{display:flex;gap:6px;margin-top:6px;}
  .bigbtn{flex:1;background:var(--gold);color:#191104;border:0;border-radius:6px;font-size:14px;font-weight:700;padding:12px;}
  .bigbtn.sub{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);font-weight:400;}
  .bigbtn:disabled{background:#4a3d22;color:#b3a077;}
  /* ---------- sheet (modal selections) ---------- */
  #sheetwrap{position:absolute;inset:0;z-index:50;display:none;background:#0008;}
  #sheetwrap.on{display:block;}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:62dvh;overflow-y:auto;background:#1d1811;border-top:2px solid var(--gold);border-radius:12px 12px 0 0;padding:12px;transition:transform .28s cubic-bezier(.16,1.12,.3,1);}
  #sheetwrap[data-closing="1"] #sheet{pointer-events:none;}
  #sheetwrap.peek #sheet{transform:translateY(calc(100% - 44px));}
  #sheetwrap.peek{background:#0003;}
  #peekbtn{position:absolute;right:10px;bottom:calc(62dvh + 8px);z-index:51;display:none;background:#241a0e;color:var(--gold);border:1px solid var(--gold-dim);border-radius:8px;font-size:12px;padding:9px 12px;cursor:pointer;}
  #sheetwrap.on #peekbtn{display:block;}
  #sheetx{position:absolute;right:118px;bottom:calc(62dvh + 8px);z-index:51;display:none;width:40px;height:40px;background:#241a0e;color:var(--gold);border:1px solid var(--gold-dim);border-radius:8px;font-size:16px;cursor:pointer;}
  #sheetwrap.on[data-kind="view"] #sheetx{display:block;}
  #sheetwrap.peek #sheetx{bottom:auto;top:10px;}
  #sheetwrap.peek #peekbtn{bottom:auto;top:10px;}
  #sheet .seg button{min-height:39px;}
  #midbar{position:relative;}
  #midbar.busy::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busyslide 1.1s linear infinite;pointer-events:none;}
  @keyframes busyslide{from{background-position:-40% 0;}to{background-position:140% 0;}}
  #infopop{position:absolute;left:12px;right:12px;top:9%;z-index:55;display:none;background:#241d12;border:1px solid var(--gold);border-radius:10px;padding:12px;max-height:64%;overflow-y:auto;box-shadow:0 10px 34px #000c;}
  #infopop.on{display:block;}
  #infopop .ttl{font-size:15px;font-weight:700;color:var(--gold);}
  #infopop .sub{font-size:11px;color:var(--txt-dim);margin:2px 0 6px;}
  #infopop .cardtext{font-size:12px;line-height:1.65;}
  #sheet .ttl{font-size:13px;font-weight:700;color:var(--gold);}
  #sheet .sub{font-size:11px;color:var(--txt-dim);margin:2px 0 8px;}
  #sheet .warn{font-size:11px;color:var(--bad);margin-bottom:6px;}
  #tray{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
  .chip{font-size:11px;border:1px solid var(--gold);border-radius:10px;padding:5px 8px;background:#4a3a10;cursor:pointer;}
  .chip.locked{border-color:var(--txt-dim);background:var(--panel2);cursor:default;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;}
  .gcard{border:1px solid var(--tile-edge);border-radius:6px;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;min-height:64px;padding:4px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;}
  .gcard .nm{font-size:10px;background:#000a;padding:1px 3px;border-radius:2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gcard .loc{font-size:9px;color:var(--gold);background:#000a;padding:0 3px;border-radius:2px;}
  .gcard.sel{box-shadow:0 0 0 2px var(--ok);}
  .btnrow{display:flex;gap:6px;margin-top:12px;position:sticky;bottom:0;background:#1d1811;z-index:2;padding-bottom:2px;}
  .optbtn{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:6px;font-size:13px;padding:12px;margin:4px 0;cursor:pointer;}
  .optbtn.disabled{opacity:.45;cursor:default;border-style:dashed;}
  .optbtn .reason{display:block;font-size:11px;color:var(--txt-dim);margin-top:2px;}
  .posrow{display:flex;gap:8px;justify-content:center;margin:8px 0;}
  .posbtn{width:74px;border:1px solid var(--tile-edge);border-radius:6px;background:var(--panel2);padding:8px 4px;text-align:center;cursor:pointer;font-size:11px;}
  .posbtn .glyph{width:34px;height:44px;margin:0 auto 4px;border-radius:3px;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;}
  .posbtn .glyph.def{transform:rotate(90deg);}
  .posbtn .glyph.back{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .sortrow{display:flex;align-items:center;gap:6px;border:1px solid var(--tile-edge);border-radius:6px;padding:6px 8px;margin:4px 0;background:var(--panel2);font-size:12px;}
  /* brushup round 2 (sheet-open stall): long sheet lists skip the
     layout/paint of rows below the fold until they scroll near
     (content-visibility:auto; the 'auto' intrinsic size is the
     browser-remembered real size after first render). Bench on
     the heaviest sheet (16-card grid, full texts): open+forced-
     layout 9.7ms median / 52.7ms max -> 1.0 / 18.2. Rendered
     rows are unchanged. */
  #sheet .gcard{content-visibility:auto;contain-intrinsic-size:auto 104px;}
  #sheet .sortrow{content-visibility:auto;contain-intrinsic-size:auto 34px;}
  /* brushup round 2: reason line under a pile-sheet row (the
     cannot-activate reasons on the grave / EX surfaces) */
  #sheet .rowreason{font-size:10px;color:#f0c08a;padding:0 8px 5px;line-height:1.5;}
  .sortrow .mv{margin-left:auto;display:flex;gap:4px;}
  .sortrow .chev{margin-left:auto;color:var(--txt-dim);font-size:14px;}
  .sortrow button{background:var(--panel);color:var(--txt);border:1px solid var(--tile-edge);border-radius:4px;padding:9px 11px;}
  .counterrow{display:flex;align-items:center;gap:8px;border:1px solid var(--tile-edge);border-radius:6px;padding:6px 8px;margin:4px 0;background:var(--panel2);font-size:12px;}
  .counterrow .ctl{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .counterrow button{width:36px;height:36px;border-radius:18px;background:var(--panel);color:var(--txt);border:1px solid var(--gold-dim);font-size:16px;}
  /* ---------- overlays ---------- */
  .overlay{position:absolute;inset:0;z-index:60;background:#0d0b08f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;}
  .overlay h1{font-size:22px;color:var(--gold);margin:0;}
  .overlay p{font-size:13px;color:var(--txt-dim);line-height:1.7;margin:0;}
  .overlay .startbtn{background:var(--gold);color:#191104;border:0;border-radius:8px;font-size:17px;font-weight:700;padding:14px 34px;}
  #result{display:none;}
  /* round B: the start screen gained two setting rows (cut-in /
     response mode) — at short viewports the column can exceed the
     screen, so the START overlay (not the duel board) may scroll */
  #start{justify-content:flex-start;overflow-y:auto;padding:6px 20px 8px;}
  #start h1{font-size:20px;margin:2px 0 2px;}
  #start .startbtn{margin-top:auto;}
  /* placement hint is an overlay banner under the top bar — it must never
     push the board down when it appears mid-duel */
  #placehint{display:none;position:absolute;top:44px;left:0;right:0;z-index:30;background:#4a3a10;color:#ffe9a8;font-size:12px;text-align:center;padding:6px;border-bottom:1px solid var(--gold);pointer-events:none;}
  #placehint .retry{color:#ff9a8a;font-size:11px;margin-top:2px;}
  #placehint.on{display:block;}
  /* ---------- phase 2 additions ---------- */
  #sheet .ctx{font-size:11px;color:var(--gold);margin:2px 0 6px;}
  #sheet .cardtext{font-size:11px;line-height:1.6;color:var(--txt);background:var(--panel2);border:1px solid var(--tile-edge);border-radius:6px;padding:7px 9px;margin-top:8px;white-space:pre-wrap;}
  /* the asked-about effect, pinned (which-effect identification) */
  .fxlab{font-size:10px;font-weight:700;color:var(--gold);margin-top:8px;}
  .cardtext.fxmain{border-color:var(--gold);background:#241a08;margin-top:3px;}
  details.fxfull{margin-top:6px;}
  details.fxfull summary{font-size:10px;color:var(--txt-dim);cursor:pointer;padding:2px 0;}
  details.fxfull .cardtext{margin-top:4px;color:var(--txt-dim);}
  #infopop .fxlab{font-size:10px;font-weight:700;color:var(--gold);margin-top:8px;}
  .cand .fxline{font-size:10px;line-height:1.45;color:var(--gold);margin-top:2px;}
  .gcard{position:relative;}
  .gcard .stats{font-size:10px;color:var(--gold);background:#000a;padding:0 3px;border-radius:2px;margin-top:2px;}
  .gcard .gdetail{position:absolute;top:3px;right:3px;font-size:10px;background:#000c;color:var(--gold);border:1px solid var(--gold-dim);border-radius:5px;padding:4px 7px;cursor:pointer;z-index:2;}
  .gcard .itext{font-size:10px;line-height:1.45;color:var(--txt);background:#000a;padding:2px 3px;border-radius:2px;margin-top:2px;max-height:64px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}
  .cand .dueldismiss{display:inline-block;margin-top:5px;font-size:11px;color:#f0c08a;background:#2a1c0d;border:1px solid #a86a2a;border-radius:6px;padding:6px 10px;cursor:pointer;}
  .cand .candinfo{display:inline-block;margin-top:5px;margin-left:6px;font-size:11px;color:var(--gold);background:#171208;border:1px solid var(--gold-dim);border-radius:6px;padding:6px 10px;cursor:pointer;}
  #dock .duelsection{font-size:10px;color:var(--txt-dim);margin-top:6px;}
  #dock .duelsection button{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:8px;font-size:11px;padding:5px 10px;margin-left:6px;cursor:pointer;}
  #autopass{display:none;position:absolute;left:8px;bottom:calc(var(--hh) + 33px);z-index:45;background:#4a3a10ee;color:#ffe9a8;border:1px solid var(--gold);border-radius:12px;font-size:11px;padding:5px 10px;cursor:pointer;}
  #autopass.on{display:block;}
  #autopass.flash{background:#7a5a10;color:#fff;font-weight:700;}
  /* ---------- presentation FX layer (rounds A/B) ----------
     All duel presentation lives in #fxlayer as absolutely positioned
     overlays computed from painted rects. The layer never receives
     pointer events and is NOT part of the in-flow stack: the board's
     frozen layout (applyLayout) is untouched by anything here, and a
     re-render of the zones can never kill an in-flight overlay (zone
     DOM is rebuilt per batch; the layer is not). #fxcutin sits above
     the board but below the chain dock so a response prompt is never
     covered by a cinematic. */
  /* LAYER ORDER TABLE (V3 stage 1 — the single ordering authority;
     mirrored in NOTES "V3 integration — Stage 1". No presentation
     element may be created outside #fxlayer / #fxcutin; controls
     always sit above every FX layer):
       (flow) board/hand/midbar — the frozen duel layout
       z25 #fxlayer  — grammar FX + board particles (#fxcv) + chain pops + phase banner
       z30 #placehint — placement instruction banner
       z35 #fxcutin  — ace / finisher scene host + top particles (#fxcvTop)
       z40 #dock / z45 #autopass / z50 #sheetwrap — controls
       z60 .overlay  — start / result
     (V3 stage 3: the round B z65 body-level wash exception is GONE;
     the finisher lives inside #fxcutin and the result is separated
     from it by a time gate, not by stacking.) */
  #fxlayer{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden;}
  #fxlayer canvas,#fxcutin canvas{position:absolute;inset:0;width:100%;height:100%;}
  #fxcutin{position:absolute;inset:0;z-index:35;pointer-events:none;overflow:hidden;display:none;}
  #fxcutin.on{display:block;}
  .fx{position:absolute;pointer-events:none;border-radius:5px;}
  /* summon portals: shape/color encode the METHOD (presentation 3-1) */
  /* NOTE: no translate(-50%,-50%) here — fxNode() already centers the
     box on the zone; a CSS centering transform on top of that placed
     every portal half a size up-left of its zone (caught on the
     390x620 fusion screenshot, round A). */
  .fx-portal .ring{position:absolute;inset:0;border-radius:50%;}
  .fx-portal.fusion .ring{background:repeating-conic-gradient(from 10deg, rgba(178,134,255,.95) 0deg 16deg, rgba(74,44,178,.30) 16deg 34deg);-webkit-mask:radial-gradient(circle,transparent 54%,#000 62%,#000 88%,transparent 95%);mask:radial-gradient(circle,transparent 54%,#000 62%,#000 88%,transparent 95%);animation:fxspin .55s linear infinite;box-shadow:0 0 18px #7a4fd088;}
  .fx-portal.fusion .ring::after{content:'';position:absolute;inset:23%;border-radius:50%;background:repeating-conic-gradient(from 190deg, rgba(216,188,255,.85) 0deg 10deg, rgba(90,60,200,.20) 10deg 26deg);-webkit-mask:radial-gradient(circle,transparent 52%,#000 62%,#000 84%,transparent 92%);mask:radial-gradient(circle,transparent 52%,#000 62%,#000 84%,transparent 92%);animation:fxspinrev .9s linear infinite;}
  .fx-portal.xyz .ring{border:3px solid #59d8f2;box-shadow:0 0 14px #59d8f2aa,inset 0 0 12px #59d8f288;animation:fxspinrev 1.1s linear infinite;}
  .fx-portal.xyz .ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:radial-gradient(circle at 20% 30%,#dff8ff 0 2px,transparent 3px),radial-gradient(circle at 78% 22%,#bff0ff 0 2px,transparent 3px),radial-gradient(circle at 62% 82%,#e8fbff 0 2px,transparent 3px),radial-gradient(circle at 30% 74%,#aee6ff 0 1.5px,transparent 2.5px);}
  .fx-portal.synchro .ring{border:3px solid #6fe08a;box-shadow:0 0 12px #6fe08aaa,inset 0 0 10px #6fe08a66;animation:fxconverge .6s ease-out both;}
  .fx-portal.generic .ring{background:radial-gradient(circle,#ffe9a8cc 0%,#c9a22755 45%,transparent 70%);animation:fxpulse .6s ease-out both;}
  .fx-portal.revive .ring{border:3px solid #ffe9a8;box-shadow:0 0 14px #ffe9a8aa,inset 0 0 10px #ffe9a866;animation:fxpulse .7s ease-out both;}
  @keyframes fxspin{to{transform:rotate(360deg);}}
  @keyframes fxspinrev{to{transform:rotate(-360deg);}}
  @keyframes fxconverge{from{transform:scale(1.7);opacity:.2;}to{transform:scale(1);opacity:1;}}
  @keyframes fxpulse{0%{transform:scale(.55);opacity:0;}35%{opacity:1;}100%{transform:scale(1.12);opacity:.9;}}
  /* zone pre-glow drawn in the layer (the slot element itself is
     re-created by the next render, so glows never attach to it) */
  .fx-zoneglows{border:2px solid var(--gold);box-shadow:0 0 14px #c9a22799,inset 0 0 10px #c9a22744;background:#c9a22714;}
  /* flying / sliding card ghosts */
  .fx-ghost{border:1px solid var(--gold-dim);background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;box-shadow:0 2px 8px #000a;overflow:hidden;}
  .fx-ghost .nm{position:absolute;left:1px;right:1px;bottom:1px;font-size:9px;line-height:1.15;background:#000a;padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
  .fx-ghost.back{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  /* a set S/T activation that is also the chain's new link carries
     the big cyan link number on the tilted card itself (round B) */
  .fx-ghost .setno{position:absolute;top:1px;left:4px;font-size:22px;font-weight:700;color:#59d8f2;text-shadow:0 2px 6px #000,0 0 10px #59d8f288;line-height:1;}
  .fx-ghost.srcglow{box-shadow:0 0 0 2px #e06666,0 0 14px #e06666aa;}
  /* restrained flashes (destruction = white flash and gone) */
  .fx-flash{background:radial-gradient(circle,#ffffffee 0%,#ffffff88 40%,transparent 72%);}
  .fx-stripflash{background:linear-gradient(#ffe9a8dd,#c9a22788);border-radius:2px;}
  .fx-pilebox{border:2px solid var(--gold);background:#c9a22722;box-shadow:0 0 10px #c9a22788;}
  /* xyz material peel layer */
  .fx-peel{border:1px solid var(--gold-dim);background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);box-shadow:0 2px 6px #000a;}
  /* phase banner: an overlay band, shown only at the transition */
  /* redesign E (proto 案5 / p5a): the phase name stands engraved
     at board centre — 23px gold, letter-spacing 0.38em, NO band
     behind it (the old dark band + borders are gone; the sweep
     line over the mid bar below carries the motion). The battle
     variant is GOLD too: the prototype (p5a/p5b, battle phase in
     gold) supersedes the old red battle variant. All glow here is
     static paint; the scene only writes transform/opacity. */
  .fx-phase{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:23px;font-weight:800;letter-spacing:.38em;padding:0 0 0 .38em;color:#e6c877;text-shadow:0 2px 10px rgba(0,0,0,.8),0 0 18px rgba(230,200,119,.35);pointer-events:none;}
  .fx-phase.battle{color:#e6c877;}
  /* redesign E (p5a): the travelling sweep segment over the mid
     bar — a 2px gold line, gradient rising to a bright tip at its
     leading (right) end. The scene moves it with transform only;
     the glow is this static box-shadow paint, never rewritten. */
  .fx-phase-sweep{height:2px;background:linear-gradient(90deg,rgba(201,162,39,.05),#c9a227 55%,#fff2c0);box-shadow:0 0 8px rgba(230,200,119,.7);border-radius:1px;pointer-events:none;}
  /* attack declaration: thin cyan line + impact (round B, MD-style) */
  .fx-line{height:3px;background:linear-gradient(90deg,#aef3ff,#59d8f2);box-shadow:0 0 8px #59d8f2cc;border-radius:2px;transform-origin:0 50%;}
  .fx-impact{transform:translate(-50%,-50%);border-radius:50%;}
  .fx-atkbanner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:17px;font-weight:700;letter-spacing:.3em;padding:7px 0 7px .3em;color:#dff8ff;background:linear-gradient(90deg,transparent,#0e2a3acc 18%,#0e2a3acc 82%,transparent);pointer-events:none;}
  /* ace cut-in (round B): darkened field, big card, name/ATK/DEF banner;
     LP/HUD stay visible because the scrim is translucent */
  #fxcutin .scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#1a1430cc,#050308e8 75%);}
  #fxcutin .bigcard{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);border:2px solid var(--gold);border-radius:8px;background:#3a2f1d url('../assets/card-art-placeholder.jpg') center/cover;box-shadow:0 0 42px #7a4fd077,0 6px 24px #000c;overflow:hidden;}
  #fxcutin .bigcard .nm{position:absolute;left:4px;right:4px;bottom:4px;font-size:13px;background:#000b;padding:3px 6px;border-radius:3px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #fxcutin .banner{position:absolute;left:0;right:0;top:66%;text-align:center;color:#ffe9a8;}
  #fxcutin .banner .cn{font-size:19px;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 8px #000;}
  #fxcutin .banner .rule{height:2px;width:180px;margin:5px auto 1px;background:linear-gradient(90deg,transparent,#c9a227,#ffe9a8,#c9a227,transparent);transform:scaleX(0);}
  #fxcutin .banner .cs{font-size:14px;margin-top:3px;color:var(--txt);text-shadow:0 2px 6px #000;}
  /* full-screen finisher wash (round B): body-level + fixed so it
     paints over the result overlay for its 1.3 s (see fxFinisher) */
  /* V3 stage 3: ace / finisher scene elements (driven by the scene engine) */
  .fx3-vortexA,.fx3-vortexB{position:absolute;border-radius:50%;pointer-events:none;}
  .fx3-acebg{position:absolute;left:50%;top:40%;width:430px;height:430px;margin:-215px 0 0 -215px;border-radius:50%;pointer-events:none;}
  .fx3-acestreaks{position:absolute;left:50%;top:40%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;}
  .fx3-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(0,0,0,.9);}
  .fx3-wash{position:absolute;border-radius:50%;pointer-events:none;}
  .fx3-beam .gl{height:11px;top:-5px;}
  .fx3-beam .cl{height:4px;top:-2px;}
  /* redesign D (p4b): the opponent's action name tag — a thin
     lapis strip at the top of the screen (height 22px, 3px lapis
     band on the left, no gold: lapis = the opponent's turn /
     information, principle 4). A transient overlay in #fxlayer,
     shown ~1.6 s by fxOppNameTag; it never enters the flow, so
     the board layout cannot move under it. */
  .fx-oppnametag{position:absolute;top:44px;left:6px;height:22px;line-height:22px;max-width:calc(100% - 12px);padding:0 10px 0 8px;border-left:3px solid #5b8dd9;background:rgba(10,18,34,.88);color:#cfe2ff;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
  /* heal float (round B): the ONLY floating number — damage is read
     off the LP counter's count-down, MD-style */
  .fx-healfloat{font-size:15px;font-weight:700;color:#8fd8ff;text-shadow:0 1px 4px #000;}
  /* Redesign F: non-battle LP chips (cost / effect damage / heal).
     An engraved stamp at the LP plate that lingers ~2.4 s while the
     counter counts underneath it. All paint is static here (the
     glow included) — the FX layer only animates transform/opacity
     via WAAPI, never box-shadow/filter per frame. Colour = meaning
     (principle 4): a cost is gold (paid by choice), effect damage
     is white-hot/red (dealt, never confused with the battle damage
     number — this is a CHIP, a bordered stamp, not a bare numeral),
     a heal is gold for me / lapis-white for the opponent. */
  .fx3-lpchip{transform:translate(-50%,-100%);font-size:14px;font-weight:800;letter-spacing:.04em;color:#ffe9a8;background:linear-gradient(160deg,#3a2f1d,#241c0e);border:1.5px solid #c9a227;border-radius:10px;padding:2px 9px;box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 12px rgba(201,162,39,.35),inset 0 1px 0 rgba(255,233,168,.35);text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap;}
  /* Redesign F / F2: opponent variant — anchored at the plate's
     bottom interior edge, opening DOWNWARD into the board so the
     chip is never clipped by the top of the screen. */
  .fx3-lpchip--down{transform:translate(-50%,0);}
  .fx3-lpchip--pay{color:#ffe9a8;border-color:#c9a227;}
  .fx3-lpchip--damage{color:#ffc9c2;border-color:#ff5348;background:linear-gradient(160deg,#3d130e,#240a08);box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 12px rgba(255,60,40,.4),inset 0 1px 0 rgba(255,201,194,.3);}
  .fx3-lpchip--heal.fx3-lpchip--mine{color:#ffe9a8;border-color:#c9a227;}
  .fx3-lpchip--heal.fx3-lpchip--opp{color:#eaf4ff;border-color:#7fa8e0;background:linear-gradient(160deg,#1a2c4a,#0e1a30);box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 12px rgba(91,141,217,.4),inset 0 1px 0 rgba(234,244,255,.3);}
  /* the heal float node doubles as the heal chip (fxHealFloat
     carries the .fx3-lpchip classes above); its old bare-numeral
     paint is superseded by the chip paint, and the opponent float
     gets the same downward variant as the chips */
  .fx-healfloat--down{transform:translate(-50%,0);}
  /* Redesign C (proto 案3 / p3a/p3b): the battle-destruction
     result chip — an engraved stone tablet reading 破壊 that
     lingers beside the destroyed zone's lower-right corner as
     residual light (~2.6 s, fade + a 3px rise, transform/opacity
     only via WAAPI in fxResultChip). Sized ~44x18px to the
     prototype: stone gradient, 1px gold frame, gold text. All
     paint is static here. Battle destruction ONLY — effect
     destruction never gets this chip (see fxProcessInner). */
  .fx3-resultchip{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.14em;padding-left:.14em;color:#e6c877;background:linear-gradient(180deg,#2a2113,#1a1409);border:1px solid #c9a227;border-radius:3px;box-shadow:inset 0 1px 0 rgba(230,200,119,.25),0 2px 6px rgba(0,0,0,.5);text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap;}
  /* chain foreground pop (round B): the newest link, large, with its
     number — it shrinks toward the chain bar */
  .fx-chainpop{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);min-width:150px;max-width:240px;border:2px solid #59d8f2;border-radius:8px;background:#12222bee;color:#dff8ff;padding:10px 12px;text-align:center;box-shadow:0 0 20px #59d8f266;pointer-events:none;}
  .fx-chainpop .no{display:block;font-size:26px;font-weight:700;color:#59d8f2;line-height:1;}
  .fx-chainpop .cn2{font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-chainpop.solving{border-color:var(--gold);color:#ffe9a8;box-shadow:0 0 20px #c9a22766;}
  /* V3 stage 2: scene-driven battle/chain elements. Per-frame values
     (transform/opacity) are written by the scene engine; only the
     static paint lives here. */
  .fx3-emph{border:2px solid #fff;border-radius:6px;pointer-events:none;}
  .fx3-trim{border:2px solid #fff;border-radius:6px;pointer-events:none;}
  .fx3-linew{position:absolute;height:0;pointer-events:none;transform-origin:0 50%;}
  .fx3-linew .gl{position:absolute;left:0;top:-4px;height:9px;width:100%;background:linear-gradient(90deg,#59d8f200,#59d8f2cc 30%,#aefcff);border-radius:5px;}
  .fx3-linew .cl{position:absolute;left:0;top:-1px;height:3px;width:100%;background:linear-gradient(90deg,#bdf3ff66,#eaffff);border-radius:2px;}
  .fx3-tip{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle,#ffffff 0%,#aefcff 45%,transparent 72%);pointer-events:none;}
  .fx3-core{border-radius:50%;pointer-events:none;}
  .fx3-ring{border:2px solid #fff;border-radius:50%;pointer-events:none;}
  .fx3-dmgnum{position:absolute;transform:translate(-50%,-100%);font-size:19px;font-weight:800;color:#ff5348;text-shadow:0 1px 5px #000,0 0 12px #ff220066;pointer-events:none;white-space:nowrap;}
  /* Redesign A / F2: opponent variant — anchored at the LP plate's
     bottom edge, opening DOWNWARD into the board so the glyphs are
     never clipped by the top of the screen (proto p1c). The scene
     writes the matching translate(-50%,0) transform per frame. */
  .fx3-dmgnum--down{transform:translate(-50%,0);}
  /* Redesign A / F3: the white silhouette that carries the target's
     read at the shifted white-hot peak (proto p1d) — white card
     rectangle, gold rim, name band. All paint is static here; the
     scene only animates opacity/transform on this node. */
  .fx3-silhouette{background:linear-gradient(160deg,#ffffff,#e8e2d2);border-radius:5px;box-shadow:0 0 0 2px #e6c877,0 0 22px rgba(255,244,200,.55);overflow:hidden;pointer-events:none;}
  .fx3-silhouette .nm{position:absolute;left:2px;right:2px;bottom:2px;font-size:8px;line-height:1.15;color:#4a3a12;background:rgba(255,255,255,.65);padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lpflash{animation:lpflashA .34s ease-out;}
  @keyframes lpflashA{0%{color:#ff6a5e;text-shadow:0 0 14px #ff3020;}100%{}}
  .fx3-chainno{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-size:30px;font-weight:800;color:#59d8f2;text-shadow:0 2px 6px #000,0 0 16px #59d8f288;line-height:1;pointer-events:none;}
  .fx3-chainring{position:absolute;left:50%;bottom:-24px;width:52px;height:52px;margin-left:-26px;border:2px solid #59d8f2;border-radius:50%;pointer-events:none;}
  .fx3-linkline{position:absolute;height:3px;background:repeating-linear-gradient(90deg,#59d8f2 0 7px,transparent 7px 14px);pointer-events:none;transform-origin:0 50%;opacity:.85;}
  .fx3-portal{pointer-events:none}
  .fx3-portal .r1,.fx3-portal .r2{position:absolute;inset:0;border-radius:50%}
  .fx3-portal.revive .r1{background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,217,77,.85) 70deg,transparent 110deg 200deg,rgba(255,217,77,.85) 240deg,transparent 280deg)}
  .fx3-portal.revive .r2{background:radial-gradient(circle,transparent 52%,rgba(255,217,77,.5) 68%,transparent 78%)}
  .fx3-portal.fusion .r1{background:conic-gradient(from 0deg,rgba(183,139,255,.8),transparent 40%,rgba(183,139,255,.8) 55%,transparent 90%)}
  .fx3-portal.fusion .r2{background:radial-gradient(circle,rgba(183,139,255,.35) 0,transparent 62%)}
  .fx3-portal.xyz .r1{background:conic-gradient(from 0deg,#0a0a12 0 30%,#ffd94d 46%,#0a0a12 62% 100%)}
  .fx3-portal.xyz .r2{background:radial-gradient(circle,transparent 46%,rgba(255,217,77,.55) 60%,transparent 74%)}
  .fx3-portal.synchro .r1{background:conic-gradient(from 0deg,rgba(207,232,216,.85),transparent 45%,rgba(207,232,216,.85) 60%,transparent 95%)}
  .fx3-portal.synchro .r2{background:radial-gradient(circle,rgba(207,232,216,.3) 0,transparent 60%)}
  .fx3-portal.generic .r1{background:conic-gradient(from 0deg,rgba(232,213,183,.75),transparent 42%,rgba(232,213,183,.75) 58%,transparent 92%)}
  .fx3-portal.generic .r2{background:radial-gradient(circle,rgba(232,213,183,.28) 0,transparent 60%)}
  /* synchro grammar (proposal S / proto 案6): material lights, level
     pips, the engraved total and the stone ring. Every glow is a
     preset static layer here — the scenes only ever animate
     transform / opacity on these nodes. Lapis = tuner / information,
     gold = the rest / the confirmed total (principle 4). */
  .fx3-syntuner{border:2px solid #5b8dd9;border-radius:50%;box-shadow:inset 0 0 12px rgba(38,97,156,.55),0 0 10px rgba(91,141,217,.35);pointer-events:none;}
  .fx3-syngold{border:2px solid #c9a227;border-radius:6px;background:rgba(230,200,119,.08);box-shadow:0 0 14px rgba(230,200,119,.45),inset 0 0 12px rgba(230,200,119,.30);pointer-events:none;}
  .fx3-syntag{background:#12233f;color:#9db8e8;border:1px solid #5b8dd9;border-radius:3px;font-size:9px;letter-spacing:.08em;text-align:center;line-height:15px;pointer-events:none;}
  .fx3-synpip{border-radius:50%;pointer-events:none;}
  .fx3-synpip.lapis{background:#7fa8e0;box-shadow:0 0 6px rgba(127,168,224,.8);}
  .fx3-synpip.gold{background:#e6c877;box-shadow:0 0 6px rgba(230,200,119,.8);}
  .fx3-synpip.outline{background:transparent;border:1.5px solid #8a7a4d;box-shadow:none;}
  .fx3-synnum{text-align:center;font-weight:800;color:#e6c877;text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;line-height:40px;}
  .fx3-synnum .n{font-size:30px;}
  .fx3-synnum .tot{font-size:13px;font-weight:700;color:#a89878;margin-left:2px;}
  .fx3-synring{border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from -90deg,#8a7648 0deg 34deg,#5a4a2a 34deg 40deg,#7d6a3e 40deg 74deg,#5a4a2a 74deg 80deg);box-shadow:inset 0 0 0 3px #241c0e,0 0 18px rgba(0,0,0,.55);}
  .fx3-synring .core{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle,#0d1a2e 30%,#060a14 75%);box-shadow:inset 0 0 16px rgba(91,141,217,.55);}
  .fx3-synring .seam{position:absolute;left:50%;top:-3px;width:3px;height:10px;margin-left:-1.5px;background:#fff2c0;box-shadow:0 0 7px #ffe98a;}
  .fx3-synrim{border:2px solid #ffd94d;border-radius:6px;box-shadow:0 0 18px rgba(255,217,77,.45);pointer-events:none;}
  .fx3-chainrim{position:absolute;border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.95),0 12px 34px rgba(0,0,0,.55);pointer-events:none;}
  .fx3-chainword{position:absolute;transform:translate(-50%,-50%);font-size:20px;font-weight:800;letter-spacing:.3em;color:#59d8f2;text-shadow:0 2px 8px #000,0 0 18px #59d8f288;pointer-events:none;z-index:7;white-space:nowrap;}
  .fx3-chainword span{display:inline-block;}
  .fx3-goldframe{position:absolute;border-radius:6px;box-shadow:0 0 0 2px rgba(255,217,77,.95),0 12px 34px rgba(0,0,0,.55);pointer-events:none;}
  .fx3-goldglow{position:absolute;border-radius:50%;box-shadow:0 0 24px 6px rgba(201,162,39,.7);pointer-events:none;}
  .fx3-grayframe{position:absolute;border-radius:6px;box-shadow:0 0 0 2px rgba(170,170,170,.9),0 12px 34px rgba(0,0,0,.55);pointer-events:none;}
  .fx-chainpop.solving .no{color:var(--gold);}
  /* chain bar upgrades (round B): CHAIN label, newest link forward,
     resolved links dim */
  #chainbar .chainlbl{flex:0 0 auto;font-size:10px;font-weight:700;color:#59d8f2;border:1px solid #59d8f2;border-radius:10px;padding:2px 7px;background:#12222b;white-space:nowrap;}
  /* redesign B (p2b): once a link has landed, the floating CHAIN
     word is absorbed into this label — gold text + a gold
     underline (the 2px bottom border is offset by 1px less bottom
     padding, so the bar's frozen height never changes), and the
     landed chip keeps a gold frame. Static paint only: the FX
     layer toggles the class once, at the landing / at render. */
  #chainbar .chainlbl.landed{color:#e6c877;border-bottom:2px solid #c9a227;padding-bottom:1px;}
  #chainbar .link.landed{box-shadow:0 0 0 1.5px #c9a227;}
  .link.newest{border-color:#59d8f2;background:#12222b;color:#dff8ff;transform:scale(1.12);}
  .link.done{opacity:.45;}
  /* detail preview: modified ATK/DEF in MD's light blue */
  #preview .pv-stats .mod{color:#8fd8ff;font-weight:700;}
  /* defense position (round B, MD-style): the card ARTWORK rotates
     90 degrees inside the tile; the stat strip stays outside and
     unrotated, with DEF emphasised */
  .tile .inner .art{position:absolute;inset:0;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;border-radius:4px;}
  .tile.back .inner .art{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .slotstats.defmode span.defline{color:#8fd8ff;}
  .slotstats.defmode span.defline b{color:#8fd8ff;font-size:10px;}
  /* xyz material stack edges: layered inset steps at the tile corner */
  .tile.mats1{box-shadow:inset -3px -3px 0 0 #171208,inset -4.5px -4.5px 0 0 var(--gold-dim);}
  .tile.mats2{box-shadow:inset -3px -3px 0 0 #171208,inset -4.5px -4.5px 0 0 var(--gold-dim),inset -6px -6px 0 0 #171208,inset -7.5px -7.5px 0 0 var(--gold-dim);}
  .tile .ctrs{position:absolute;top:1px;left:1px;background:#2a6f3a;color:#dfffe0;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;z-index:2;}
  .segrow{margin:5px 0 3px;font-size:11px;color:var(--txt-dim);letter-spacing:.18em;text-align:left;width:100%;}
  .seg{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap;}
  .seg button{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:8px;font-size:13px;padding:9px 14px;cursor:pointer;}
  .seg button.sel{background:#3a2a10;color:#ffe9a8;font-weight:700;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
  /* DS-04: seg sub-labels reserve two lines whether they wrap or
     not, so a row of seg buttons keeps one height. */
  .seg button small{display:block;font-size:10px;font-weight:400;margin-top:2px;line-height:1.2;min-height:2.4em;}
  #start .tagline{font-size:11.5px;color:#c9b586;margin-top:2px;margin-bottom:4px;}
  #start .deckgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  #start .deck{position:relative;display:flex;gap:7px;align-items:center;text-align:left;background:#1d1508;border:1px solid #4a3a1c;border-radius:10px;padding:6px;min-height:48px;color:var(--txt);cursor:pointer;width:100%;}
  #start .deck img{width:26px;height:36px;object-fit:cover;border-radius:4px;flex:none;}
  /* DS-01: a deck name never wraps — a mid-word break orphaned
     「ン」 on its own line. Same rule as card names: one line,
     ellipsis as the backstop; 12px fits both current names. */
  #start .deck .dn{display:block;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #start .deck .dd{display:block;font-size:10.5px;color:var(--txt-dim);line-height:1.45;margin-top:2px;}
  #start .deck.sel{background:#3a2a10;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
  #start .deck.sel .dn{color:#ffe9a8;}
  #start .deck .check{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold);display:none;}
  #start .deck.sel .check{display:block;}
  #start .seg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;}
  #start .seg3 button{min-height:38px;font-size:14px;}
  #start .settings{width:100%;margin-top:6px;border-top:1px solid #2c2110;padding-top:5px;}
  #start .srow{display:flex;align-items:center;gap:10px;margin-bottom:4px;width:100%;}
  #start .srow .sl{width:86px;flex:none;font-size:12px;color:#c9b586;text-align:left;}
  #start .srow .seg{flex:1;margin-top:0;flex-wrap:nowrap;}
  #start .srow .seg button{flex:1;font-size:11.5px;padding:5px 2px;min-height:32px;line-height:1.35;}
  #start .srow .seg button small{display:block;font-size:9.5px;font-weight:400;color:var(--txt-dim);}
  #start .srow .seg button.sel small{color:#d8bc7a;}
  .switch{position:relative;width:52px;height:30px;flex:none;background:#171008;border:1px solid #3a2c12;border-radius:15px;cursor:pointer;padding:0;}
  .switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#6d5a30;transition:transform .18s,background .18s;}
  .switch.on{border-color:var(--gold);}
  .switch.on .knob{transform:translateX(22px);background:var(--gold);}
  .sstate{font-size:12px;color:#c9b586;width:34px;text-align:left;}
  #start .startbtn{width:100%;min-height:52px;font-size:19px;letter-spacing:.14em;border-radius:12px;}
  #start .startbtn:disabled{background:#4a3d22;color:#8a7c55;}
  #loadmsg{font-size:11px;color:var(--txt-dim);margin:0;}
  #vsoverlay{position:absolute;inset:0;background:#070503;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;}
  #vsoverlay.on{display:flex;}
  #vsoverlay .beam{position:absolute;top:50%;width:70%;height:3px;border-radius:2px;}
  #vsoverlay .bl{left:-10%;background:linear-gradient(90deg,transparent,#57d8ff);transform:rotate(9deg);}
  #vsoverlay .br{right:-10%;background:linear-gradient(270deg,transparent,#ff9a57);transform:rotate(-9deg);}
  #vsoverlay .vst{font-size:30px;font-weight:900;color:#ffe9a8;letter-spacing:.3em;z-index:2;}
  #vsoverlay .vss{font-size:13px;color:#c9b586;margin-top:12px;z-index:2;line-height:1.7;}
  .resultbtns{display:flex;gap:12px;}
  /* Result buttons keep their labels on one line (both wrapped to
     two lines at 390 wide — design audit frame 06-duel-late). */
  .resultbtns .startbtn{min-height:53px;font-size:15px;padding:14px 12px;white-space:nowrap;}
  .resultbtns .subbtn{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:8px;font-size:14px;padding:14px 12px;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div><div class="who">相手（CPU）</div><div class="lp" id="oppLp">8000</div></div>
    <div class="mid" id="turninfo">—</div>
  </div>
  <div id="placehint"></div>
  <div class="field" id="oppField">
    <div class="turnbreathe" id="oppBreathe" aria-hidden="true"></div>
    <div class="pilebar" id="oppPilebar"></div>
    <div class="zrow" id="oppSzone"></div>
    <div class="zrow" id="oppMzone"></div>
  </div>
  <div id="midbar">
    <div id="chainbar"></div>
    <div id="logline">読み込み中…</div>
    <div id="phasebar">
      <div><div style="font-size:10px;color:var(--txt-dim)">自分</div><div class="lp" id="myLp">8000</div></div>
      <div id="phaseinfo">—</div>
      <button id="menubtn" disabled>その他</button>
      <button id="fxbtn">演出設定</button>
      <button id="phasebtn" disabled>—</button>
    </div>
  </div>
  <div class="field" id="myField">
    <div class="turndim" id="myDim" aria-hidden="true"></div>
    <div class="zrow" id="myMzone"></div>
    <div class="zrow" id="mySzone"></div>
    <div class="pilebar" id="myPilebar"></div>
  </div>
  <div id="preview"></div>
  <div id="handbar">
    <div class="who">自分の手札（<span id="handcount">0</span>）</div>
    <div id="hand"></div>
  </div>
  <div id="fxlayer"><canvas id="fxcv"></canvas></div>
  <div id="fxcutin"><canvas id="fxcvTop"></canvas></div>
  <div id="dock"></div>
  <div id="autopass"></div>
  <div id="sheetwrap"><button id="sheetx" title="閉じる">×</button><button id="peekbtn">盤面を見る</button><div id="sheet"></div></div>
  <div id="infopop"></div>
  <div class="overlay" id="start">
    <h1>トトと簡易デュエル</h1>
    <p class="tagline">CPUとの1対1。デッキと先攻を選んで開始。</p>
    <div class="segrow">自分のデッキ</div>
    <div class="deckgrid seg" id="seg-mydeck">
      <button class="deck sel" data-v="ishizu"><img src="../assets/card-art-placeholder-s.jpg" alt=""><span><span class="dn">イシズ</span><span class="dd">44枚／墓地を入れ替える逆転のデッキ</span></span><span class="check"></span></button>
      <button class="deck" data-v="gg"><img src="../assets/card-art-placeholder-s.jpg" alt=""><span><span class="dn">ゲート・ガーディアン</span><span class="dd">40枚／三魔神の合体と壁のデッキ</span></span><span class="check"></span></button>
    </div>
    <div class="segrow">相手のデッキ</div>
    <div class="deckgrid seg" id="seg-opdeck">
      <button class="deck" data-v="ishizu"><img src="../assets/card-art-placeholder-s.jpg" alt=""><span><span class="dn">イシズ</span><span class="dd">44枚／墓地を入れ替える逆転のデッキ</span></span><span class="check"></span></button>
      <button class="deck sel" data-v="gg"><img src="../assets/card-art-placeholder-s.jpg" alt=""><span><span class="dn">ゲート・ガーディアン</span><span class="dd">40枚／三魔神の合体と壁のデッキ</span></span><span class="check"></span></button>
    </div>
    <div class="segrow">先攻・後攻</div>
    <div class="seg seg3" id="seg-first">
      <button data-v="first" class="sel">先攻</button>
      <button data-v="second">後攻</button>
      <button data-v="random">ランダム</button>
    </div>
    <div class="settings">
      <div class="srow"><div class="sl">チェーン確認</div>
        <div class="seg" id="seg-resp">
          <button data-v="auto" class="sel">おまかせ<small>「聞かない」設定だけ自動パス</small></button>
          <button data-v="on">毎回<small>すべてのチェーンで聞く</small></button>
          <button data-v="off">自動<small>必須以外は聞かずにパス</small></button>
        </div>
      </div>
      <div class="srow"><div class="sl">召喚カットイン</div>
        <div class="seg" id="seg-cutin">
          <button data-v="on" class="sel">出す</button>
          <button data-v="off">出さない</button>
        </div>
      </div>
      <div class="srow"><div class="sl">音</div>
        <button class="switch on" id="soundbtn" aria-label="音のオン・オフ"><span class="knob"></span></button>
        <span class="sstate" id="sndstate">オン</span>
      </div>
    </div>
    <button class="startbtn" id="startbtn" disabled>読み込み中…</button>
    <p id="loadmsg">読み込み中…</p>
    <div id="vsoverlay"><div class="beam bl"></div><div class="beam br"></div><div class="vst">VS</div><div class="vss" id="vssub"></div></div>
  </div>
  <div class="overlay" id="result">
    <h1 id="resultTitle">—</h1>
    <p id="resultDetail">—</p>
    <p id="resultSub" style="font-size:12px;color:var(--txt-dim);margin:0;"></p>
    <div class="resultbtns">
      <button class="startbtn" id="againbtn">同じ設定でもう1戦</button>
      <button class="subbtn" id="titlebtn">タイトルに戻る</button>
    </div>
  </div>
</div>
<script src="build/ocgcore.js"></script>
<script src="engine.js"></script>
<script src="client.js"></script>
</body>
</html>
