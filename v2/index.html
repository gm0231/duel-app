<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>トトと簡易デュエル v2 (ocgcore) — Phase 2</title>
<style>
  :root{
    --gold:#c9a227; --gold-dim:#8a6d1f; --ink:#0d0b08; --panel:#1b1712; --panel2:#241e16;
    --tile:#2a2318; --tile-edge:#4a3d22; --txt:#e8dcc0; --txt-dim:#a89878; --bad:#e06666; --ok:#7fc97f;
    /* layout sizes — recomputed by client.js applyLayout() at duel start and
       frozen for the whole duel; these are pre-duel fallbacks */
    --sw:47px; --sh:79px; --hw:56px; --hh:90px; --pv:0px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
  /* layout round 4 hardening: never let a webview inflate text on its own —
     the stat strips budget exact px per line (see .slotstats/.hstats) */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  #app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  #app>*{flex:0 0 auto;}
  /* ---------- top bar ---------- */
  #topbar{display:flex;align-items:center;gap:8px;height:44px;padding:3px 8px;background:linear-gradient(#241c10,#171208);border-bottom:1px solid var(--gold-dim);overflow:hidden;}
  #topbar .who{font-size:11px;color:var(--txt-dim);}
  #topbar .lp{font-size:17px;font-weight:700;color:var(--gold);min-width:64px;}
  #topbar .mid{flex:1;text-align:center;font-size:12px;}
  #topbar .piles{font-size:11px;color:var(--txt-dim);text-align:right;line-height:1.5;}
  /* ---------- field ---------- */
  .field{padding:3px 6px 2px;}
  .zrow{display:flex;gap:4px;justify-content:center;align-items:flex-end;margin:2px 0;}
  .zrow .rowlabel{font-size:9px;color:var(--txt-dim);width:26px;text-align:right;padding-bottom:4px;}
  /* all zones share ONE size (user spec); the slot is the zone box, the tile
     (card image) sits inside it, and ATK/DEF live in a strip at the slot
     bottom — OUTSIDE the card frame, with ATK/DEF labels */
  .slot{width:var(--sw);height:var(--sh);border:1px solid var(--tile-edge);border-radius:5px;background:var(--tile);position:relative;flex:0 0 auto;overflow:hidden;}
  .slot .znum{position:absolute;top:0;left:2px;font-size:8px;color:#6b5c3a;z-index:3;}
  .slot.hl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 12px #c9a22788;cursor:pointer;animation:pulse 1s infinite alternate;}
  .slot.picked{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);}
  @keyframes pulse{from{box-shadow:0 0 0 1px var(--gold);}to{box-shadow:0 0 0 3px var(--gold),0 0 14px #c9a227aa;}}
  .tile{position:absolute;top:1px;left:1px;right:1px;bottom:1px;border-radius:4px;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:2px;}
  .slot.hs .tile{bottom:23px;}
  /* layout round 4: the strip is TWO stacked lines (ATK line over DEF
     line), never one row of two spans. The old one-row form could not
     fit "ATK 3750"+"DEF 3400" (~83px at 9/10px) inside a 53-64px
     strip at ANY viewport size: flex-shrink narrowed each span until
     its text wrapped, the 28px two-line span overflowed the 15px
     strip symmetrically, and the number line's lower half was clipped
     by the slot's overflow:hidden — height-independent, invisible to
     the box-bottom fit loop. Each line here is nowrap with an explicit
     11px line-height, so a line can only ever overflow horizontally
     (clipped inside its own line), never vertically. Widths measured
     in Chromium: worst line "DEF 3400" = 38.3px at 8px/9px, ~35.8px
     with the -.5px letter-spacing — inside the 36px inner width of
     even the minimum 40px tile. */
  .slotstats{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex;flex-direction:column;justify-content:center;padding:0 2px;font-size:8px;letter-spacing:-.5px;color:var(--txt-dim);overflow:hidden;}
  .slotstats span{display:block;white-space:nowrap;overflow:hidden;line-height:11px;}
  .slotstats b{color:var(--txt);font-size:9px;}
  .tile .nm{font-size:clamp(8px, calc(var(--sw) * 0.17), 12px);line-height:1.15;background:#000a;padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile.def .inner{transform:rotate(90deg);}
  .tile .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:2px;transition:transform .15s;}
  .tile.back{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .tile.back .nm{display:none;}
  .tile .mats{position:absolute;top:1px;right:1px;background:var(--gold);color:#000;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;z-index:2;}
  .tile.actionable{box-shadow:0 0 0 2px #7fc97f inset;cursor:pointer;}
  .slot.targeted{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad);}
  /* ---------- piles ---------- */
  .pilebar{display:flex;gap:4px;justify-content:center;margin:1px 0;height:21px;}
  .pile{min-width:52px;height:21px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid var(--tile-edge);border-radius:5px;background:var(--panel);font-size:10px;text-align:center;color:var(--txt-dim);cursor:pointer;}
  .pile b{color:var(--txt);font-size:12px;}
  .pile.actionable{border-color:var(--ok);color:var(--txt);}
  /* ---------- mid bar ---------- */
  #midbar{background:var(--panel);border-top:1px solid var(--tile-edge);border-bottom:1px solid var(--tile-edge);padding:3px 6px;}
  /* the chain row's height is ALWAYS reserved (visibility toggles, never
     display) so a chain appearing mid-duel cannot shift the board */
  #chainbar{display:flex;visibility:hidden;gap:4px;overflow-x:auto;height:21px;padding:2px 0;}
  #chainbar.on{visibility:visible;}
  .link{flex:0 0 auto;font-size:10px;border:1px solid var(--gold-dim);border-radius:10px;padding:2px 7px;background:var(--panel2);white-space:nowrap;}
  .link.solving{border-color:var(--gold);background:#4a3a10;color:#fff;}
  .link.negated{text-decoration:line-through;opacity:.55;}
  .link .no{color:var(--gold);font-weight:700;}
  #logline{font-size:10px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px;line-height:15px;}
  #phasebar{display:flex;align-items:center;gap:8px;height:34px;}
  #phasebar .lp{font-size:16px;font-weight:700;color:var(--gold);}
  #phaseinfo{flex:1;font-size:12px;text-align:center;}
  #phasebtn{background:var(--gold);color:#191104;border:0;border-radius:6px;font-size:13px;font-weight:700;padding:0 10px;height:32px;min-width:104px;}
  #phasebtn:disabled{background:#4a3d22;color:#8a7c55;}
  #menubtn{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:6px;font-size:12px;padding:0 8px;height:32px;}
  /* ---------- hand ---------- */
  #handbar{background:var(--panel);border-top:1px solid var(--gold-dim);padding:4px 4px 6px;}
  #handbar .who{font-size:10px;color:var(--txt-dim);padding:0 2px;height:13px;line-height:13px;}
  /* layout round 4: no visible scrollbar on the hand — in classic-
     scrollbar environments the horizontal bar renders INSIDE #hand's
     fixed height and eats the bottom ~15px of every card, which is
     exactly the .hstats strip (observed in the parent's browser at 6
     hand cards: stats row gone entirely, names still visible).
     Scrolling itself (touch / wheel / drag) is unaffected. */
  #hand{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;height:var(--hh);scrollbar-width:none;}
  #hand::-webkit-scrollbar{display:none;}
  /* hand card: image area on top (name overlaid at its bottom), ATK/DEF in a
     strip BELOW the image — outside the card frame, same as board tiles */
  .hcard{width:var(--hw);height:var(--hh);flex:0 0 auto;border:1px solid var(--tile-edge);border-radius:5px;background:var(--tile);position:relative;padding:0;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;}
  .himg{flex:1 1 auto;position:relative;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;}
  .hcard .nm{position:absolute;left:2px;right:2px;bottom:2px;font-size:clamp(8px, calc(var(--hw) * 0.13), 12px);line-height:1.15;background:#000a;padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* layout round 4: same two-line strip as .slotstats (see there) —
     the one-row form wrapped identically and the wrapped number line
     was clipped by .hcard's overflow:hidden at the card's bottom edge */
  .hstats{height:22px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;padding:0 2px;font-size:8px;letter-spacing:-.5px;color:var(--txt-dim);overflow:hidden;}
  .hstats span{display:block;white-space:nowrap;overflow:hidden;line-height:11px;}
  .hstats b{color:var(--txt);font-size:9px;}
  .hcard.actionable{box-shadow:0 0 0 2px var(--ok);}
  .hcard.back .himg{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  /* ---------- persistent card-detail preview (leftover space only) ---------- */
  #preview{display:none;height:var(--pv);border-top:1px solid var(--gold-dim);background:var(--panel);padding:6px 8px;gap:8px;overflow:hidden;cursor:pointer;}
  #preview.on{display:flex;}
  #preview .pv-art{flex:0 0 auto;width:calc((var(--pv) - 12px) * 0.72);background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;border-radius:4px;border:1px solid var(--tile-edge);}
  #preview .pv-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  #preview .pv-top{display:flex;gap:8px;align-items:baseline;}
  #preview .pv-name{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #preview .pv-stats{font-size:11px;color:var(--txt);white-space:nowrap;}
  #preview .pv-meta{font-size:10px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #preview .pv-text{flex:1 1 auto;overflow-y:auto;font-size:11px;line-height:1.55;white-space:pre-wrap;margin-top:2px;}
  #preview.compact .pv-art{display:none;}
  #preview.compact .pv-text{display:none;}
  #preview.compact .pv-meta{display:none;}
  /* ---------- chain dock ---------- */
  #dock{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#171208f2;border-top:2px solid var(--gold);padding:8px;display:none;}
  #dock.on{display:block;}
  #dock .ttl{font-size:12px;color:var(--gold);font-weight:700;}
  #dock .ctx{font-size:11px;color:var(--txt-dim);margin:2px 0 6px;}
  #dock .cands{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .cand{flex:0 0 auto;max-width:150px;border:1px solid var(--ok);border-radius:6px;background:var(--panel2);padding:6px 8px;font-size:11px;cursor:pointer;position:relative;}
  .cand .loc{color:var(--txt-dim);font-size:10px;}
  .cand .dismiss{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:10px;background:#54301a;color:#f0c08a;border:1px solid #a86a2a;font-size:11px;line-height:18px;text-align:center;}
  .cand.dismissed{opacity:.45;border-style:dashed;}
  #dock .row{display:flex;gap:6px;margin-top:6px;}
  .bigbtn{flex:1;background:var(--gold);color:#191104;border:0;border-radius:6px;font-size:14px;font-weight:700;padding:10px;}
  .bigbtn.sub{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);font-weight:400;}
  .bigbtn:disabled{background:#4a3d22;color:#8a7c55;}
  /* ---------- sheet (modal selections) ---------- */
  #sheetwrap{position:absolute;inset:0;z-index:50;display:none;background:#0008;}
  #sheetwrap.on{display:block;}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:62dvh;overflow-y:auto;background:#1d1811;border-top:2px solid var(--gold);border-radius:12px 12px 0 0;padding:10px;}
  #sheet .ttl{font-size:13px;font-weight:700;color:var(--gold);}
  #sheet .sub{font-size:11px;color:var(--txt-dim);margin:2px 0 8px;}
  #sheet .warn{font-size:11px;color:var(--bad);margin-bottom:6px;}
  #tray{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
  .chip{font-size:11px;border:1px solid var(--gold);border-radius:10px;padding:2px 8px;background:#4a3a10;cursor:pointer;}
  .chip.locked{border-color:var(--txt-dim);background:var(--panel2);cursor:default;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;}
  .gcard{border:1px solid var(--tile-edge);border-radius:6px;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;min-height:64px;padding:4px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;}
  .gcard .nm{font-size:10px;background:#000a;padding:1px 3px;border-radius:2px;line-height:1.2;}
  .gcard .loc{font-size:9px;color:var(--gold);background:#000a;padding:0 3px;border-radius:2px;}
  .gcard.sel{box-shadow:0 0 0 2px var(--ok);}
  .btnrow{display:flex;gap:6px;margin-top:10px;}
  .optbtn{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:6px;font-size:13px;padding:11px;margin:4px 0;cursor:pointer;}
  .posrow{display:flex;gap:8px;justify-content:center;margin:8px 0;}
  .posbtn{width:74px;border:1px solid var(--tile-edge);border-radius:6px;background:var(--panel2);padding:8px 4px;text-align:center;cursor:pointer;font-size:11px;}
  .posbtn .glyph{width:34px;height:44px;margin:0 auto 4px;border-radius:3px;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;}
  .posbtn .glyph.def{transform:rotate(90deg);}
  .posbtn .glyph.back{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .sortrow{display:flex;align-items:center;gap:6px;border:1px solid var(--tile-edge);border-radius:6px;padding:6px 8px;margin:4px 0;background:var(--panel2);font-size:12px;}
  .sortrow .mv{margin-left:auto;display:flex;gap:4px;}
  .sortrow button{background:var(--panel);color:var(--txt);border:1px solid var(--tile-edge);border-radius:4px;padding:5px 9px;}
  .counterrow{display:flex;align-items:center;gap:8px;border:1px solid var(--tile-edge);border-radius:6px;padding:6px 8px;margin:4px 0;background:var(--panel2);font-size:12px;}
  .counterrow .ctl{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .counterrow button{width:32px;height:32px;border-radius:16px;background:var(--panel);color:var(--txt);border:1px solid var(--gold-dim);font-size:16px;}
  /* ---------- overlays ---------- */
  .overlay{position:absolute;inset:0;z-index:60;background:#0d0b08f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;}
  .overlay h1{font-size:22px;color:var(--gold);margin:0;}
  .overlay p{font-size:13px;color:var(--txt-dim);line-height:1.7;margin:0;}
  .overlay .startbtn{background:var(--gold);color:#191104;border:0;border-radius:8px;font-size:17px;font-weight:700;padding:14px 34px;}
  #result{display:none;}
  /* placement hint is an overlay banner under the top bar — it must never
     push the board down when it appears mid-duel */
  #placehint{display:none;position:absolute;top:44px;left:0;right:0;z-index:30;background:#4a3a10;color:#ffe9a8;font-size:12px;text-align:center;padding:6px;border-bottom:1px solid var(--gold);}
  #placehint.on{display:block;}
  /* ---------- phase 2 additions ---------- */
  #sheet .ctx{font-size:11px;color:var(--gold);margin:2px 0 6px;}
  #sheet .cardtext{font-size:11px;line-height:1.6;color:var(--txt);background:var(--panel2);border:1px solid var(--tile-edge);border-radius:6px;padding:7px 9px;margin-top:8px;white-space:pre-wrap;}
  .gcard .itext{font-size:9px;line-height:1.45;color:var(--txt);background:#000a;padding:2px 3px;border-radius:2px;margin-top:2px;max-height:64px;overflow:hidden;}
  .cand .dueldismiss{display:block;margin-top:4px;font-size:9px;color:#f0c08a;text-decoration:underline;cursor:pointer;}
  #dock .duelsection{font-size:10px;color:var(--txt-dim);margin-top:6px;}
  #dock .duelsection button{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:8px;font-size:10px;padding:2px 8px;margin-left:6px;cursor:pointer;}
  #autopass{display:none;position:absolute;left:8px;bottom:calc(var(--hh) + 33px);z-index:45;background:#4a3a10ee;color:#ffe9a8;border:1px solid var(--gold);border-radius:12px;font-size:11px;padding:5px 10px;cursor:pointer;}
  #autopass.on{display:block;}
  #autopass.flash{background:#7a5a10;color:#fff;font-weight:700;}
  /* ---------- presentation FX layer (rounds A/B) ----------
     All duel presentation lives in #fxlayer as absolutely positioned
     overlays computed from painted rects. The layer never receives
     pointer events and is NOT part of the in-flow stack: the board's
     frozen layout (applyLayout) is untouched by anything here, and a
     re-render of the zones can never kill an in-flight overlay (zone
     DOM is rebuilt per batch; the layer is not). #fxcutin sits above
     the board but below the chain dock so a response prompt is never
     covered by a cinematic. */
  #fxlayer{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden;}
  #fxcutin{position:absolute;inset:0;z-index:35;pointer-events:none;overflow:hidden;display:none;}
  #fxcutin.on{display:block;}
  .fx{position:absolute;pointer-events:none;border-radius:5px;}
  /* summon portals: shape/color encode the METHOD (presentation 3-1) */
  /* NOTE: no translate(-50%,-50%) here — fxNode() already centers the
     box on the zone; a CSS centering transform on top of that placed
     every portal half a size up-left of its zone (caught on the
     390x620 fusion screenshot, round A). */
  .fx-portal .ring{position:absolute;inset:0;border-radius:50%;}
  .fx-portal.fusion .ring{background:repeating-conic-gradient(from 10deg, rgba(178,134,255,.95) 0deg 16deg, rgba(74,44,178,.30) 16deg 34deg);-webkit-mask:radial-gradient(circle,transparent 54%,#000 62%,#000 88%,transparent 95%);mask:radial-gradient(circle,transparent 54%,#000 62%,#000 88%,transparent 95%);animation:fxspin .55s linear infinite;box-shadow:0 0 18px #7a4fd088;}
  .fx-portal.fusion .ring::after{content:'';position:absolute;inset:23%;border-radius:50%;background:repeating-conic-gradient(from 190deg, rgba(216,188,255,.85) 0deg 10deg, rgba(90,60,200,.20) 10deg 26deg);-webkit-mask:radial-gradient(circle,transparent 52%,#000 62%,#000 84%,transparent 92%);mask:radial-gradient(circle,transparent 52%,#000 62%,#000 84%,transparent 92%);animation:fxspinrev .9s linear infinite;}
  .fx-portal.xyz .ring{border:3px solid #59d8f2;box-shadow:0 0 14px #59d8f2aa,inset 0 0 12px #59d8f288;animation:fxspinrev 1.1s linear infinite;}
  .fx-portal.xyz .ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:radial-gradient(circle at 20% 30%,#dff8ff 0 2px,transparent 3px),radial-gradient(circle at 78% 22%,#bff0ff 0 2px,transparent 3px),radial-gradient(circle at 62% 82%,#e8fbff 0 2px,transparent 3px),radial-gradient(circle at 30% 74%,#aee6ff 0 1.5px,transparent 2.5px);}
  .fx-portal.synchro .ring{border:3px solid #6fe08a;box-shadow:0 0 12px #6fe08aaa,inset 0 0 10px #6fe08a66;animation:fxconverge .6s ease-out both;}
  .fx-portal.generic .ring{background:radial-gradient(circle,#ffe9a8cc 0%,#c9a22755 45%,transparent 70%);animation:fxpulse .6s ease-out both;}
  .fx-portal.revive .ring{border:3px solid #ffe9a8;box-shadow:0 0 14px #ffe9a8aa,inset 0 0 10px #ffe9a866;animation:fxpulse .7s ease-out both;}
  @keyframes fxspin{to{transform:rotate(360deg);}}
  @keyframes fxspinrev{to{transform:rotate(-360deg);}}
  @keyframes fxconverge{from{transform:scale(1.7);opacity:.2;}to{transform:scale(1);opacity:1;}}
  @keyframes fxpulse{0%{transform:scale(.55);opacity:0;}35%{opacity:1;}100%{transform:scale(1.12);opacity:.9;}}
  /* zone pre-glow drawn in the layer (the slot element itself is
     re-created by the next render, so glows never attach to it) */
  .fx-zoneglows{border:2px solid var(--gold);box-shadow:0 0 14px #c9a22799,inset 0 0 10px #c9a22744;background:#c9a22714;}
  /* flying / sliding card ghosts */
  .fx-ghost{border:1px solid var(--gold-dim);background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;box-shadow:0 2px 8px #000a;overflow:hidden;}
  .fx-ghost .nm{position:absolute;left:1px;right:1px;bottom:1px;font-size:8px;line-height:1.15;background:#000a;padding:1px 2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
  .fx-ghost.back{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .fx-ghost.srcglow{box-shadow:0 0 0 2px #e06666,0 0 14px #e06666aa;}
  /* restrained flashes (destruction = white flash and gone) */
  .fx-flash{background:radial-gradient(circle,#ffffffee 0%,#ffffff88 40%,transparent 72%);}
  .fx-stripflash{background:linear-gradient(#ffe9a8dd,#c9a22788);border-radius:2px;}
  .fx-pilebox{border:2px solid var(--gold);background:#c9a22722;box-shadow:0 0 10px #c9a22788;}
  /* xyz material peel layer */
  .fx-peel{border:1px solid var(--gold-dim);background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);box-shadow:0 2px 6px #000a;}
  /* phase banner: an overlay band, shown only at the transition */
  .fx-phase{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:19px;font-weight:700;letter-spacing:.35em;padding:9px 0 9px .35em;color:#ffe9a8;background:linear-gradient(90deg,transparent,#2a2110ee 18%,#2a2110ee 82%,transparent);border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);pointer-events:none;}
  .fx-phase.battle{color:#ffb3a0;background:linear-gradient(90deg,transparent,#4a140eee 18%,#4a140eee 82%,transparent);border-color:#a83a22;}
  /* attack declaration: thin cyan line + impact (round B, MD-style) */
  .fx-line{height:3px;background:linear-gradient(90deg,#aef3ff,#59d8f2);box-shadow:0 0 8px #59d8f2cc;border-radius:2px;transform-origin:0 50%;}
  .fx-impact{transform:translate(-50%,-50%);border-radius:50%;}
  .fx-atkbanner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:17px;font-weight:700;letter-spacing:.3em;padding:7px 0 7px .3em;color:#dff8ff;background:linear-gradient(90deg,transparent,#0e2a3acc 18%,#0e2a3acc 82%,transparent);pointer-events:none;}
  /* ace cut-in (round B): darkened field, big card, name/ATK/DEF banner;
     LP/HUD stay visible because the scrim is translucent */
  #fxcutin .scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#1a1430cc,#050308e8 75%);}
  #fxcutin .bigcard{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);border:2px solid var(--gold);border-radius:8px;background:#3a2f1d url('../assets/card-art-placeholder.jpg') center/cover;box-shadow:0 0 42px #7a4fd077,0 6px 24px #000c;overflow:hidden;}
  #fxcutin .bigcard .nm{position:absolute;left:4px;right:4px;bottom:4px;font-size:13px;background:#000b;padding:3px 6px;border-radius:3px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #fxcutin .banner{position:absolute;left:0;right:0;top:66%;text-align:center;color:#ffe9a8;}
  #fxcutin .banner .cn{font-size:19px;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 8px #000;}
  #fxcutin .banner .cs{font-size:14px;margin-top:3px;color:var(--txt);text-shadow:0 2px 6px #000;}
  /* full-screen finisher wash (round B) */
  .fx-finishwash{position:absolute;inset:0;pointer-events:none;}
  /* chain foreground pop (round B): the newest link, large, with its
     number — it shrinks toward the chain bar */
  .fx-chainpop{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);min-width:150px;max-width:240px;border:2px solid #59d8f2;border-radius:8px;background:#12222bee;color:#dff8ff;padding:10px 12px;text-align:center;box-shadow:0 0 20px #59d8f266;pointer-events:none;}
  .fx-chainpop .no{display:block;font-size:26px;font-weight:700;color:#59d8f2;line-height:1;}
  .fx-chainpop .cn2{font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-chainpop.solving{border-color:var(--gold);color:#ffe9a8;box-shadow:0 0 20px #c9a22766;}
  .fx-chainpop.solving .no{color:var(--gold);}
  /* chain bar upgrades (round B): CHAIN label, newest link forward,
     resolved links dim */
  #chainbar .chainlbl{flex:0 0 auto;font-size:10px;font-weight:700;color:#59d8f2;border:1px solid #59d8f2;border-radius:10px;padding:2px 7px;background:#12222b;white-space:nowrap;}
  .link.newest{border-color:#59d8f2;background:#12222b;color:#dff8ff;transform:scale(1.12);}
  .link.done{opacity:.45;}
  /* detail preview: modified ATK/DEF in MD's light blue */
  #preview .pv-stats .mod{color:#8fd8ff;font-weight:700;}
  /* defense position (round B, MD-style): the card ARTWORK rotates
     90 degrees inside the tile; the stat strip stays outside and
     unrotated, with DEF emphasised */
  .tile .inner .art{position:absolute;inset:0;background:#3a2f1d url('../assets/card-art-placeholder-s.jpg') center/cover;border-radius:4px;}
  .tile.back .inner .art{background:repeating-linear-gradient(45deg,#3d2c14 0 6px,#2c1f0d 6px 12px);}
  .slotstats.defmode span.defline{color:#8fd8ff;}
  .slotstats.defmode span.defline b{color:#8fd8ff;font-size:10px;}
  /* xyz material stack edges: layered inset steps at the tile corner */
  .tile.mats1{box-shadow:inset -3px -3px 0 0 #171208,inset -4.5px -4.5px 0 0 var(--gold-dim);}
  .tile.mats2{box-shadow:inset -3px -3px 0 0 #171208,inset -4.5px -4.5px 0 0 var(--gold-dim),inset -6px -6px 0 0 #171208,inset -7.5px -7.5px 0 0 var(--gold-dim);}
  .tile .ctrs{position:absolute;top:1px;left:1px;background:#2a6f3a;color:#dfffe0;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;z-index:2;}
  .segrow{margin:6px 0 2px;font-size:12px;color:var(--txt-dim);}
  .seg{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap;}
  .seg button{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:8px;font-size:13px;padding:9px 14px;cursor:pointer;}
  .seg button.sel{background:var(--gold);color:#191104;font-weight:700;border-color:var(--gold);}
  .soundbtn{background:var(--panel2);color:var(--txt);border:1px solid var(--tile-edge);border-radius:8px;font-size:12px;padding:8px 14px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div><div class="who">相手（CPU）</div><div class="lp" id="oppLp">8000</div></div>
    <div class="mid" id="turninfo">—</div>
    <div class="piles" id="opppiles">手札 -<br>デッキ -</div>
  </div>
  <div id="placehint"></div>
  <div class="field" id="oppField">
    <div class="pilebar" id="oppPilebar"></div>
    <div class="zrow" id="oppSzone"></div>
    <div class="zrow" id="oppMzone"></div>
  </div>
  <div id="midbar">
    <div id="chainbar"></div>
    <div id="logline">エンジン読み込み中…</div>
    <div id="phasebar">
      <div><div style="font-size:10px;color:var(--txt-dim)">自分</div><div class="lp" id="myLp">8000</div></div>
      <div id="phaseinfo">—</div>
      <button id="menubtn" style="display:none">手札操作</button>
      <button id="phasebtn" disabled>—</button>
    </div>
  </div>
  <div class="field" id="myField">
    <div class="zrow" id="myMzone"></div>
    <div class="zrow" id="mySzone"></div>
    <div class="pilebar" id="myPilebar"></div>
  </div>
  <div id="preview"></div>
  <div id="handbar">
    <div class="who">自分の手札（<span id="handcount">0</span>）</div>
    <div id="hand"></div>
  </div>
  <div id="fxlayer"></div>
  <div id="fxcutin"></div>
  <div id="dock"></div>
  <div id="autopass"></div>
  <div id="sheetwrap"><div id="sheet"></div></div>
  <div class="overlay" id="start">
    <h1>トトと簡易デュエル v2</h1>
    <p>ocgcore（YGOPro系エンジン）版・Phase 2<br>処理は全てエンジンの要求に答える形で進行します。</p>
    <div>
      <div class="segrow">自分のデッキ</div>
      <div class="seg" id="seg-mydeck">
        <button data-v="ishizu" class="sel">イシズ</button>
        <button data-v="gg">ゲート・ガーディアン</button>
      </div>
      <div class="segrow">相手のデッキ</div>
      <div class="seg" id="seg-opdeck">
        <button data-v="ishizu">イシズ</button>
        <button data-v="gg" class="sel">ゲート・ガーディアン</button>
      </div>
      <div class="segrow">先攻・後攻</div>
      <div class="seg" id="seg-first">
        <button data-v="first" class="sel">先攻</button>
        <button data-v="second">後攻</button>
        <button data-v="random">ランダム</button>
      </div>
    </div>
    <button class="startbtn" id="startbtn">デュエル開始</button>
    <button class="soundbtn" id="soundbtn">音：ON</button>
    <p id="loadmsg">読み込み中…</p>
  </div>
  <div class="overlay" id="result">
    <h1 id="resultTitle">—</h1>
    <p id="resultDetail">—</p>
    <button class="startbtn" id="againbtn">もう一度</button>
  </div>
</div>
<script src="build/ocgcore.js"></script>
<script src="engine.js"></script>
<script src="client.js"></script>
</body>
</html>
